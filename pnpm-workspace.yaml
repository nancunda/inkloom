packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 起，pnpm 专属配置从 package.json 的 "pnpm" 字段迁到这里。
# 这些依赖需要执行 build script（下载平台二进制），默认被拦。
allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  # workerd 是 vitest 的间接依赖，本项目不用其运行时
  workerd: false
  # pi-ai 的 Bedrock/Google 适配带进来的构建脚本；本项目只用 DeepSeek 通道
  '@google/genai': false
  protobufjs: false
