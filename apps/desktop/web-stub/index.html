<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inkloom</title>
    <style>
      :root {
        --paper: #fbf8f1;
        --desk: #eae4d9;
        --ink: #2b2723;
        --muted: #6f685e;
        --faint: #9a9287;
        --rule: #e4dccf;
        --accent: #3f5d4b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--desk);
        color: var(--ink);
        font-family: 'Songti SC', 'Noto Serif CJK SC', 'Source Han Serif SC', serif;
      }
      main {
        width: min(460px, 80vw);
        padding: 48px 44px;
        background: var(--paper);
        box-shadow:
          inset 0 0 0 1px var(--rule),
          0 18px 50px -24px rgb(70 60 45 / 45%);
      }
      .mark {
        font:
          600 15px/1 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.22em;
      }
      h1 {
        margin: 18px 0 0;
        font-size: 26px;
        font-weight: 400;
        letter-spacing: 0.06em;
      }
      .rule {
        width: 56px;
        height: 1px;
        margin: 22px 0;
        background: var(--rule);
      }
      p {
        margin: 0;
        font-size: 13px;
        line-height: 2;
        color: var(--muted);
      }
      .status {
        margin-top: 26px;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--faint);
      }
      .status::after {
        content: '';
        display: inline-block;
        width: 1.2em;
        animation: dots 1.4s steps(4, end) infinite;
      }
      @keyframes dots {
        0% {
          content: '';
        }
        25% {
          content: '·';
        }
        50% {
          content: '··';
        }
        75% {
          content: '···';
        }
      }
      .error {
        display: none;
        margin-top: 22px;
        padding: 12px 14px;
        border-left: 2px solid var(--accent);
        background: rgb(63 93 75 / 6%);
        font-size: 12px;
        line-height: 1.9;
        color: var(--ink);
        white-space: pre-wrap;
      }
      body.failed .error {
        display: block;
      }
      body.failed .status {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">INKLOOM</div>
      <h1>正在翻开书页</h1>
      <div class="rule"></div>
      <p>本地服务正在启动：首次打开要编译一次，之后是秒开。</p>
      <div class="status" id="status">启动中</div>
      <div class="error" id="error"></div>
    </main>
    <script>
      // Rust 侧在服务起不来时调用它——把错误留在窗口里，而不是白屏
      window.__inkloomBootError = (message) => {
        document.body.classList.add('failed')
        const box = document.getElementById('error')
        if (box) box.textContent = '启动失败：' + message
      }
    </script>
  </body>
</html>
